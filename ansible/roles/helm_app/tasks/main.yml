---
- name: Check if Helm is installed
  command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Install Helm if not installed
  shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: helm_check.rc != 0

- name: Verify Helm installation
  command: helm version --short
  changed_when: false

- name: Copy Helm chart to master node
  copy:
    src: "{{ playbook_dir }}/../helm/modernchair/"
    dest: /tmp/modernchair/
    mode: "0755"

- name: Create application namespace
  command: kubectl create namespace modernchair
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: namespace_create
  changed_when: namespace_create.rc == 0
  failed_when: namespace_create.rc != 0 and 'AlreadyExists' not in namespace_create.stderr

- name: Deploy ModernChair application using Helm
  command: >
    helm upgrade --install modernchair /tmp/modernchair
    --namespace modernchair
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Verify ModernChair deployment
  command: kubectl get all -n modernchair
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false