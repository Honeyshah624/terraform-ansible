- name: Configure common Kubernetes components on all nodes
  hosts: k8s_cluster
  become: true
  roles:
    - common

- name: Initialize Kubernetes master node
  hosts: master
  become: true
  roles:
    - master

- name: Join worker node to Kubernetes cluster
  hosts: workers
  become: true
  roles:
    - worker

- name: Install Helm and deploy ModernChair application
  hosts: master
  become: true
  roles:
    - helm_app